<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lilith's Throne — Community Edition 0.38.0</title>
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div id="app" class="chrome-left-hidden chrome-right-hidden">
    <aside id="col-left">
      <div id="left-slot">
        <section data-ui="attributes" data-ui-target="left" hidden></section>
        <section id="hud-clock" hidden></section>
        <section data-ui="map" data-ui-target="left-map" hidden>
          <div class="map-wrap">
            <div class="map-container" id="grid"></div>
            <div id="map-vignette" class="map-vignette" hidden></div>
          </div>
        </section>
      </div>
      <div id="left-buttons"></div>
    </aside>

    <main id="col-center">
      <header id="content-title" hidden></header>
      <div id="ui-stage">
        <section data-ui="disclaimer" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="patch-notes" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="main-menu" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="options" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="dialogue" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="creation-appearance" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="creation-name" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="creation-advanced" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="creation-core" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="creation-face" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="creation-hair" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="creation-breasts" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="creation-ass" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="creation-genitals" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="creation-makeup" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="creation-piercings" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="creation-tattoos" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="creation-body-hair" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="creation-wardrobe" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="creation-background" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="creation-jobs" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>

        <section data-ui="creation-sex-experience" data-ui-target="stage" hidden>

        </section>
        <section data-ui="inventory" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
        <section data-ui="phone" data-ui-target="stage" hidden>
          <div class="dialogue-text" data-node-content></div>
        </section>
      </div>
      <footer id="responses">
        <div class="response-full-container">
          <div id="response-tabs" hidden></div>
          <div id="response-grid"></div>
          <div class="response-row-extra">
            <div class="response-box empty" id="response-0"></div>
          </div>
        </div>
      </footer>
    </main>

    <aside id="col-right">
      <div id="right-slot">
        <section data-ui="characters-present" data-ui-target="right" hidden>
          <div data-node-content></div>
        </section>
      </div>
      <div id="right-buttons"></div>
    </aside>
  </div>

  <div id="tooltip" data-ui="tooltip" data-ui-target="overlay" hidden></div>

  <script src="js/boot.js"></script>
</body>
</html>
